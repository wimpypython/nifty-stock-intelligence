name: Daily Nifty 50 Data Update

# NSE closes at 15:30 IST (10:00 UTC). Running at 03:30 UTC (09:00 IST) the
# NEXT morning leaves Yahoo several hours to finalise the day's numbers.
#
# GitHub's scheduler is best-effort and often runs late under load. That is
# fine here: the fetch is incremental, so a late or skipped run simply picks
# up whatever is missing on the next pass.

on:
  schedule:
    - cron: '30 3 * * 2-6'    # Tue-Sat 03:30 UTC = 09:00 IST, picks up the
                              # PREVIOUS session. Yahoo can take >24h to
                              # finalise an Indian daily bar, so running at
                              # midnight IST reliably missed that day.
  workflow_dispatch:           # allows manual runs from the Actions tab

# Required for the bot to push updated CSVs back to the repo.
# Without this the workflow runs green but the commit step fails.
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        run: python scripts/update_all_stocks.py

      # Fetch success is not data currency. This records which tickers
      # actually carry the newest session, and appends the finding to
      # last_updated.txt so it becomes part of the committed audit trail.
      # It always exits 0 - enforcement happens after the commit.
      - name: Check ticker coverage
        if: success()
        run: python scripts/check_coverage.py

      - name: Commit updated data
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          # The commit message records the DATA date, not just the run time.
          # A run on the 27th that collects the 26th's session is a commit
          # about the 26th. Labelling it "2026-08-27" makes the repo's front
          # page read as more current than the data actually is.
          DATA_DATE=$(sed -n 's/^Newest data point: \([0-9-]*\).*/\1/p' \
                      data/metadata/last_updated.txt | head -n 1)
          if [ -z "$DATA_DATE" ]; then
            DATA_DATE="unknown"
          fi
          RUN_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')

          # No changes on a holiday or a re-run is normal, not an error.
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update: data through $DATA_DATE (run $RUN_TIME)"
            git push
          fi

      # Deliberately AFTER the commit. A ticker stuck for three runs is a
      # real problem worth a red X and an email, but withholding 50 healthy
      # tickers' data to signal it would help nobody. Publish, then alert.
      - name: Enforce coverage
        if: success()
        run: python scripts/check_coverage.py --enforce

      # Surface the run summary in the Actions UI so a failure is readable
      # without digging through logs.
      - name: Report status
        if: always()
        run: |
          if [ -f data/metadata/last_updated.txt ]; then
            echo "### Pipeline status" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat data/metadata/last_updated.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
